<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BALSONS PROJECT MANAGER</title>
<style>
:root{--teal:#0097B2;--teal-dark:#007A8F;--red:#E64646;--navy:#0B1A33;--bg:#F0EDE8;--surface:#FFF;--text:#1A1A1A;--muted:#888;--border:#E5E2DC;--shadow:0 6px 24px rgba(0,0,0,.12);--radius:12px;--sidebar-w:250px}
[data-theme=dark]{--bg:#0d1117;--surface:#161b22;--text:#e6edf3;--muted:#8b949e;--border:#30363d;--navy:#010409;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.hidden{display:none!important}.text-muted{color:var(--muted)}.text-red{color:var(--red)}.text-teal{color:var(--teal)}.text-center{text-align:center}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--navy)}
.login-box{background:var(--surface);padding:2.5rem;border-radius:16px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.login-box .brand{text-align:center;margin-bottom:1.5rem}.login-box .brand svg{height:56px;margin-bottom:.5rem}
.login-box .brand h1{font-size:1.5rem;color:var(--navy)}[data-theme=dark] .login-box .brand h1{color:var(--text)}
.login-box .brand h1 span{color:var(--red)}.login-box .brand p{color:var(--muted);font-size:.9rem}
.login-hint{margin-top:1rem;padding:.75rem;background:rgba(0,151,178,.08);border-radius:8px;font-size:.75rem;color:var(--muted)}
.login-hint code{color:var(--teal);font-weight:600}
#appScreen{display:none;height:100vh}#appScreen.active{display:flex}
.sidebar{width:var(--sidebar-w);background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sidebar .brand{padding:1rem;border-bottom:3px solid var(--teal);display:flex;align-items:center;gap:.6rem}
.sidebar .brand svg{height:36px}.sidebar .brand h1{font-size:.95rem;font-weight:800}.sidebar .brand h1 span{color:var(--red)}
.sidebar .brand small{display:block;font-size:.55rem;color:rgba(255,255,255,.5)}
.sidebar nav{flex:1;padding:.75rem .4rem;overflow-y:auto}
.sidebar nav a{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;border-radius:var(--radius);color:rgba(255,255,255,.7);text-decoration:none;font-size:.82rem;margin-bottom:.15rem;cursor:pointer}
.sidebar nav a .ico{width:1.1rem;text-align:center}.sidebar nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar nav a.active{background:var(--teal);color:#fff;font-weight:600}
.sidebar .user-info{padding:.75rem 1rem;border-top:1px solid rgba(255,255,255,.08);font-size:.78rem}
.sidebar .logout-btn{background:var(--red);color:#fff;border:none;padding:.35rem .8rem;border-radius:20px;font-weight:600;cursor:pointer;margin-top:.3rem;font-size:.72rem}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);padding:.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.topbar .page-title{font-weight:700;font-size:1.1rem}.topbar-right{display:flex;align-items:center;gap:.6rem}
.search-box{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:.3rem .8rem;min-width:220px;position:relative}
.search-box input{border:none;background:transparent;outline:none;font:inherit;width:100%;color:var(--text)}
.search-results{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:240px;overflow-y:auto;z-index:100;box-shadow:var(--shadow)}
.search-results div{padding:.5rem .8rem;cursor:pointer;border-bottom:1px solid var(--border);font-size:.8rem}
.search-results div:hover{background:rgba(0,151,178,.08)}
.content{flex:1;overflow-y:auto;padding:1.25rem 1.5rem 2rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.25rem}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);border-left:4px solid var(--teal)}
.stat-card .label{font-size:.68rem;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat-card .value{font-size:1.6rem;font-weight:800}.stat-card .sub{font-size:.72rem;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--radius);padding:1.1rem;box-shadow:var(--shadow);margin-bottom:1rem}
.card h3{font-size:.95rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:1rem}
.btn{padding:.45rem 1.1rem;border-radius:30px;font-weight:600;font-size:.8rem;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
.btn-primary{background:var(--teal);color:#fff}.btn-primary:hover{background:#007A8F}
.btn-danger{background:var(--red);color:#fff}.btn-secondary{background:var(--border);color:var(--text)}.btn-sm{padding:.3rem .7rem;font-size:.72rem}
.btn-icon{padding:.35rem .5rem;border-radius:6px;background:transparent;border:1px solid var(--border);cursor:pointer}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:500px}
table th{background:var(--navy);color:#fff;padding:.45rem .6rem;text-align:left}
table td{padding:.4rem .6rem;border-bottom:1px solid var(--border)}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:30px;font-size:.62rem;font-weight:700;text-transform:uppercase}
.badge-Planned,.badge-Draft{background:#E0E0E0;color:#555}
.badge-In-Progress,.badge-Pending,.badge-Monitoring,.badge-Mitigating{background:#FFF3CD;color:#856404}
.badge-Blocked,.badge-Open,.badge-Critical,.badge-Rejected{background:#F8D7DA;color:#721C24}
.badge-Completed,.badge-Approved,.badge-Verified,.badge-Active,.badge-Submitted{background:#D4EDDA;color:#155724}
.badge-High{background:#f5c6cb;color:#721c24}.badge-Medium{background:#ffeeba;color:#856404}.badge-Low{background:#d4edda;color:#155724}
.form-group{margin-bottom:.8rem}.form-group label{display:block;font-weight:600;font-size:.75rem;margin-bottom:.15rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.45rem .7rem;border:1.5px solid var(--border);border-radius:6px;font:inherit;background:var(--surface);color:var(--text)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.modal-overlay{position:fixed;inset:0;background:rgba(11,26,51,.6);display:none;align-items:center;justify-content:center;z-index:999;padding:1rem}
.modal-overlay.open{display:flex}.modal-box{background:var(--surface);border-radius:var(--radius);max-width:700px;width:100%;max-height:90vh;overflow-y:auto;padding:1.5rem}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.modal-close{font-size:1.4rem;cursor:pointer;background:none;border:none;color:var(--muted)}
.toast-container{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:.4rem}
.toast{background:var(--navy);color:#fff;padding:.55rem 1rem;border-radius:var(--radius);font-size:.82rem;border-left:4px solid var(--teal)}
.toast.success{border-left-color:#2D8F5C}.toast.error{border-left-color:var(--red)}
.subnav{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;border-bottom:1px solid var(--border);padding-bottom:.5rem}
.subnav button{background:transparent;border:none;padding:.35rem .8rem;font-weight:600;color:var(--muted);cursor:pointer;border-radius:20px}
.subnav button.active{background:var(--teal);color:#fff}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.donut-wrap{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;justify-content:center;padding:1rem}
.donut{width:180px;height:180px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.donut::after{content:'';position:absolute;width:110px;height:110px;border-radius:50%;background:var(--surface)}
.donut-label{position:relative;z-index:1;font-weight:800;font-size:1.3rem;color:var(--teal)}
.donut-legend{font-size:.8rem;display:flex;flex-direction:column;gap:.35rem}
.bar-chart{display:flex;align-items:flex-end;gap:.4rem;height:200px;padding:1rem 0}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:.25rem;min-width:36px}
.bar-stack{width:100%;max-width:44px;display:flex;flex-direction:column-reverse;gap:2px;height:150px}
.bar-seg{width:100%;border-radius:3px 3px 0 0}
.bar-label{font-size:.6rem;text-align:center;color:var(--muted)}
.progress-bar{background:var(--border);border-radius:4px;height:8px;width:100px}.progress-bar>div{height:100%;border-radius:4px;background:var(--teal)}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}.sidebar{width:64px}.sidebar .brand div,.sidebar nav a span,.sidebar .user-info{display:none}}
@media print{.sidebar,.topbar,.btn,.modal-overlay,.toast-container,.subnav{display:none!important}.content{padding:0}body{overflow:visible;background:#fff}.print-header{display:block!important;margin-bottom:1rem;border-bottom:2px solid var(--teal)}}
.print-header{display:none}
</style>
</head>
<body>
<div id="loginScreen">
<div class="login-box">
<div class="brand">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="56" height="56" aria-label="BALSONS"><defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0097B2"/><stop offset="100%" stop-color="#0B1A33"/></linearGradient></defs><polygon points="60,8 104,34 104,86 60,112 16,86 16,34" fill="url(#lg)" stroke="#0097B2" stroke-width="2"/><text x="60" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="42" fill="#E64646">B</text></svg>

<script>
(function(){
'use strict';
var DB_NAME='balsons_pems',DB_VERSION=1,PROJECT_ID='PRJ-JTRWF-001';
var STORES=['users','projects','tasks','schedule','milestones','dailyExecution','manpower','equipment','toolsInventory','toolsTransactions','resources','mobilization','risks','commercial','documents','approvals','notifications','audit','settings'];
var TASK_STATUSES=['Planned','Ready','In Progress','Blocked','Completed','Verified'];
var WORKFLOW_STAGES=['Planning','Mobilization','Heavy Lift','Positioning','Installation','Alignment','Erection','Testing','Commissioning','Demobilization','Closure'];
var RISK_LEVELS=['Low','Medium','High','Critical'];
var APPROVAL_STATUSES=['Pending','Approved','Rejected'];
var ROLES={admin:{label:'Administrator',permissions:['*']},pm:{label:'Project Manager',permissions:['dashboard:read','projects:*','wbs:*','schedule:*','milestones:*','execution:*','manpower:*','equipment:*','tools:*','resources:*','mobilization:*','risk:*','commercial:*','documents:*','approvals:*','reports:*','search:*','admin:read']},engineer:{label:'Site Engineer',permissions:['dashboard:read','projects:read','wbs:read','wbs:write','schedule:read','milestones:read','execution:*','manpower:read','equipment:read','tools:*','resources:read','mobilization:read','risk:read','risk:write','documents:read','documents:write','reports:read','search:*']},viewer:{label:'Viewer',permissions:['dashboard:read','projects:read','wbs:read','schedule:read','milestones:read','execution:read','manpower:read','equipment:read','tools:read','resources:read','mobilization:read','risk:read','commercial:read','documents:read','reports:read','search:*']}};
var NAV=[{id:'dashboard',ico:'◈',label:'Dashboard',perm:'dashboard:read'},{id:'projects',ico:'▣',label:'Projects',perm:'projects:read'},{id:'wbs',ico:'⊞',label:'WBS / Tasks',perm:'wbs:read'},{id:'schedule',ico:'◷',label:'Schedule',perm:'schedule:read'},{id:'milestones',ico:'⚑',label:'Milestones',perm:'milestones:read'},{id:'execution',ico:'⛑',label:'Daily Execution',perm:'execution:read'},{id:'manpower',ico:'👥',label:'Manpower',perm:'manpower:read'},{id:'equipment',ico:'⛟',label:'Equipment',perm:'equipment:read'},{id:'tools',ico:'🔧',label:'Tools',perm:'tools:read'},{id:'resources',ico:'📦',label:'Resources',perm:'resources:read'},{id:'mobilization',ico:'➤',label:'Mobilization',perm:'mobilization:read'},{id:'risk',ico:'⚠',label:'Risk / HSE',perm:'risk:read'},{id:'commercial',ico:'₹',label:'Commercial',perm:'commercial:read'},{id:'documents',ico:'📄',label:'Documents',perm:'documents:read'},{id:'approvals',ico:'✓',label:'Approvals',perm:'approvals:read'},{id:'reports',ico:'▤',label:'Reports',perm:'reports:read'},{id:'admin',ico:'⚙',label:'Administration',perm:'admin:read'}];
var state={user:null,currentPage:'dashboard',projectId:PROJECT_ID};
var modules={},dbP=null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type){var c=$('toastContainer');if(!c)return;var el=document.createElement('div');el.className='toast '+(type||'');el.textContent=msg;c.appendChild(el);setTimeout(function(){el.style.opacity='0';setTimeout(function(){el.remove();},300);},3500);}
function badge(st){return '<span class="badge badge-'+esc((st||'').replace(/\s+/g,'-'))+'">'+esc(st||'')+'</span>';}
function fmtCur(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});}
function fmtDate(d){return d?new Date(d).toLocaleDateString('en-IN'):'-';}
function hasPerm(p){var u=state.user;if(!u)return false;var r=ROLES[u.role];if(!r)return false;if(r.permissions.indexOf('*')>=0)return true;if(r.permissions.indexOf(p)>=0)return true;var res=p.split(':')[0];return r.permissions.indexOf(res+':*')>=0;}
function reqPerm(p){if(!hasPerm(p))throw new Error('Permission denied');}
function openDB(){if(dbP)return dbP;dbP=new Promise(function(res,rej){var r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=function(e){var db=e.target.result;STORES.forEach(function(s){if(!db.objectStoreNames.contains(s)){var os=db.createObjectStore(s,{keyPath:'id'});if(s==='audit')os.createIndex('timestamp','timestamp');if(s==='tasks'||s==='manpower')os.createIndex('projectId','projectId');}});};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return dbP;}
function tx(stores,mode){return openDB().then(function(db){return db.transaction(stores,mode||'readonly');});}
function dbAll(store){return tx([store]).then(function(t){return new Promise(function(res,rej){var q=t.objectStore(store).getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){rej(q.error);};});});}
function dbGet(store,id){return tx([store]).then(function(t){return new Promise(function(res,rej){var q=t.objectStore(store).get(id);q.onsuccess=function(){res(q.result||null);};q.onerror=function(){rej(q.error);};});});}
function dbPut(store,rec){return tx([store],'readwrite').then(function(t){return new Promise(function(res,rej){var q=t.objectStore(store).put(rec);q.onsuccess=function(){res(rec);};q.onerror=function(){rej(q.error);};});});}
function dbBulk(store,recs){return tx([store],'readwrite').then(function(t){var os=t.objectStore(store);return Promise.all(recs.map(function(r){return new Promise(function(res,rej){var q=os.put(r);q.onsuccess=res;q.onerror=rej;});}));});}
function dbDel(store,id){return tx([store],'readwrite').then(function(t){return new Promise(function(res,rej){var q=t.objectStore(store).delete(id);q.onsuccess=function(){res(true);};q.onerror=function(){rej(q.error);};});});}
function dbClear(store){return tx([store],'readwrite').then(function(t){return new Promise(function(res,rej){var q=t.objectStore(store).clear();q.onsuccess=res;q.onerror=rej;});});}
function dbEmpty(){return openDB().then(function(db){return Promise.all(STORES.map(function(s){return new Promise(function(res,rej){var t=db.transaction([s],'readonly');var q=t.objectStore(s).count();q.onsuccess=function(){res(q.result);};q.onerror=rej;});})).then(function(cs){return cs.every(function(c){return c===0;});});});}
function exportAll(){var out={};return Promise.all(STORES.map(function(s){return dbAll(s).then(function(d){out[s]=d;});})).then(function(){return out;});}
function importAll(data,clear){var p=clear?Promise.all(STORES.map(dbClear)):Promise.resolve();return p.then(function(){return Promise.all(Object.keys(data).map(function(s){if(STORES.indexOf(s)<0||!Array.isArray(data[s]))return Promise.resolve();return dbBulk(s,data[s]);}));});}
var enc=new TextEncoder();
function hashPw(pw,saltB64){var salt=Uint8Array.from(atob(saltB64),function(c){return c.charCodeAt(0);});return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(key){return crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:120000,hash:'SHA-256'},key,256);}).then(function(bits){return btoa(String.fromCharCode.apply(null,new Uint8Array(bits)));});}
function randSalt(){var s=crypto.getRandomValues(new Uint8Array(16));return btoa(String.fromCharCode.apply(null,s));}
function createUser(u){var salt=randSalt();return hashPw(u.password,salt).then(function(h){var user={id:'USR-'+u.username.toLowerCase(),username:u.username,fullName:u.fullName,role:u.role,email:u.email||'',salt:salt,passwordHash:h,active:true,createdAt:new Date().toISOString()};return dbPut('users',user).then(function(){return user;});});}
function verifyLogin(un,pw){return dbAll('users').then(function(users){var u=users.find(function(x){return x.username===un&&x.active;});if(!u)return null;return hashPw(pw,u.salt).then(function(h){if(h!==u.passwordHash)return null;var s={id:u.id,username:u.username,fullName:u.fullName,role:u.role,email:u.email};localStorage.setItem('balsons_session',JSON.stringify(s));state.user=s;return s;});});}
function loadSession(){try{var r=localStorage.getItem('balsons_session');if(!r)return null;state.user=JSON.parse(r);return state.user;}catch(e){return null;}}
function logout(){localStorage.removeItem('balsons_session');state.user=null;}
function logAudit(action,entity,entityId,details){details=details||{};var u=state.user;return crypto.subtle.digest('SHA-256',enc.encode(JSON.stringify({action:action,entity:entity,entityId:entityId,ts:Date.now()}))).then(function(h){var chk=Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');return dbPut('audit',{id:'AUD-'+Date.now(),timestamp:new Date().toISOString(),userId:u?u.id:'system',username:u?u.username:'system',action:action,entity:entity,entityId:entityId||'',details:details,checksum:chk});});}
function mkId(p,n){return p+'-'+String(n).padStart(3,'0');}
function dateOff(days){var d=new Date('2025-04-01');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}
function getSeedData(){
  var squads=['Wheel Mech','Wheel Rig','Wheel Fluid','Wheel Elec','Wheel Weld','Axle Mech','Axle Rig','Axle Fluid','Axle Elec','Axle Weld'];
  var epics=[{code:'E1',name:'Preparation',weight:10},{code:'E2',name:'Axle Line',weight:25},{code:'E3',name:'Wheel Line',weight:25},{code:'E4',name:'Integration',weight:25},{code:'E5',name:'Handover',weight:15}];

modules.reports={title:'Reports',permission:'reports:read',render:function(){return '<div class="toolbar"><h3 style="margin:0">Reports</h3><div><button class="btn btn-primary btn-sm" id="exportAllBtn">Export CSV</button> <button class="btn btn-secondary btn-sm" id="printBtn">Print</button></div></div><div id="reportContent" class="card print-area"><p class="text-muted">Loading...</p></div>';},afterRender:function(){Promise.all([computeKPIs(),list('tasks'),list('risks'),list('dailyExecution')]).then(function(res){var k=res[0],tasks=res[1],risks=res[2],execution=res[3],p=k.project||{};$('reportContent').innerHTML='<div class="print-header"><strong>BALSONS PROJECT MANAGER</strong> – '+esc(p.name||'Report')+'</div><h3>Executive Summary</h3><p>Generated: '+new Date().toLocaleString('en-IN')+' by '+esc(state.user?state.user.fullName:'User')+'</p><div class="stats-grid"><div class="stat-card"><div class="label">Progress</div><div class="value">'+k.overallProgress+'%</div></div><div class="stat-card"><div class="label">Budget Used</div><div class="value">'+k.budgetPct+'%</div></div><div class="stat-card"><div class="label">Open Risks</div><div class="value">'+k.openRisks+'</div></div></div><h4 style="margin:1rem 0 .5rem">Tasks ('+tasks.length+')</h4>'+renderTable(['Task','Status','Progress'],tasks.slice(0,20).map(function(t){return '<tr><td>'+esc(t.name)+'</td><td>'+badge(t.status)+'</td><td>'+t.progress+'%</td></tr>';}))+'<h4 style="margin:1rem 0 .5rem">Risks ('+risks.length+')</h4>'+renderTable(['Risk','Score','Level'],risks.slice(0,15).map(function(r){return '<tr><td>'+esc(r.title)+'</td><td>'+r.score+'</td><td>'+badge(r.level)+'</td></tr>';}))+'<h4 style="margin:1rem 0 .5rem">Recent DPR</h4>'+renderTable(['Date','Manpower','Equipment','Status'],execution.slice(-10).reverse().map(function(d){return '<tr><td>'+fmtDate(d.date)+'</td><td>'+d.manpowerPresent+'</td><td>'+d.equipmentActive+'</td><td>'+badge(d.dprStatus)+'</td></tr>';}));});$('exportAllBtn').onclick=function(){Promise.all([list('tasks'),list('manpower'),list('equipment'),list('toolsInventory'),list('risks')]).then(function(res){var zip=toCSV(res[0])+'\n\n---\n\n';downloadText('# Tasks\n'+toCSV(res[0])+'\n\n# Manpower\n'+toCSV(res[1])+'\n\n# Equipment\n'+toCSV(res[2])+'\n\n# Tools\n'+toCSV(res[3])+'\n\n# Risks\n'+toCSV(res[4]),'balsons-report-'+new Date().toISOString().slice(0,10)+'.csv','text/csv');toast('Exported','success');});};$('printBtn').onclick=function(){window.print();};}};
modules.admin={title:'Administration',permission:'admin:read',render:function(){return Promise.all([dbAll('audit'),dbAll('users'),getSettings()]).then(function(res){var audit=res[0].sort(function(a,b){return b.timestamp.localeCompare(a.timestamp);}).slice(0,50),users=res[1],settings=res[2];var auditRows=audit.map(function(a){return '<tr><td>'+fmtDate(a.timestamp)+'</td><td>'+esc(a.username)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.entity)+'</td><td>'+esc(a.entityId)+'</td></tr>';});var userRows=users.map(function(u){return '<tr><td>'+esc(u.username)+'</td><td>'+esc(u.fullName)+'</td><td>'+esc(u.role)+'</td><td>'+(u.active?'Active':'Inactive')+'</td></tr>';});var stores=Object.keys(CSV_SCHEMAS);return '<div class="subnav" id="adminTabs"><button class="active" data-tab="users">Users</button><button data-tab="audit">Audit</button><button data-tab="backup">Backup</button><button data-tab="import">CSV Import</button><button data-tab="settings">Settings</button></div><div id="tab-users" class="admin-panel"><div class="card"><h3>Users & RBAC</h3>'+renderTable(['Username','Name','Role','Status'],userRows)+'<p class="text-muted" style="margin-top:.8rem;font-size:.8rem">Roles: admin, pm, engineer, viewer</p></div></div><div id="tab-audit" class="admin-panel hidden"><div class="card"><h3>Audit Trail</h3>'+renderTable(['Time','User','Action','Entity','ID'],auditRows)+'</div></div><div id="tab-backup" class="admin-panel hidden"><div class="card"><h3>Backup & Restore</h3><p style="margin-bottom:1rem">Export all IndexedDB data as JSON or restore from backup.</p><button class="btn btn-primary" id="backupBtn">Download Backup</button> <label class="btn btn-secondary" style="cursor:pointer">Restore<input type="file" id="restoreFile" accept=".json" hidden></label> <button class="btn btn-danger" id="reseedBtn">Re-seed Database</button></div></div><div id="tab-import" class="admin-panel hidden"><div class="card"><h3>CSV Import</h3><p>Import → Validate → Preview → Commit</p><div class="form-row"><div class="form-group"><label>Target Store</label><select id="importStore">'+stores.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join('')+'</select></div><div class="form-group"><label>CSV File</label><input type="file" id="importFile" accept=".csv"></div></div><button class="btn btn-primary" id="validateImportBtn">Validate & Preview</button><div id="importPreview" style="margin-top:1rem"></div></div></div><div id="tab-settings" class="admin-panel hidden"><div class="card"><h3>Settings</h3><div class="form-group"><label>Theme</label><select id="themeSelect"><option value="light"'+(settings.theme==='light'?' selected':'')+'>Light</option><option value="dark"'+(settings.theme==='dark'?' selected':'')+'>Dark</option></select></div><div class="form-group"><label>Company Name</label><input id="companyName" value="'+esc(settings.companyName||'')+'"></div><button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button></div></div>';});},afterRender:function(){var previewRows=[],previewStore='';document.querySelectorAll('#adminTabs button').forEach(function(btn){btn.onclick=function(){document.querySelectorAll('#adminTabs button').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');document.querySelectorAll('.admin-panel').forEach(function(p){p.classList.add('hidden');});var tab=$('tab-'+btn.dataset.tab);if(tab)tab.classList.remove('hidden');};});$('backupBtn').onclick=function(){exportAll().then(function(data){var meta={id:'backup-'+Date.now(),createdAt:new Date().toISOString(),version:'1.0'};downloadJSON({meta:meta,data:data},'balsons-backup-'+meta.id+'.json');return logAudit('BACKUP','database',meta.id);}).then(function(){toast('Backup downloaded','success');});};$('restoreFile').onchange=function(e){var file=e.target.files[0];if(!file||!confirm('Replace all data?'))return;file.text().then(function(text){var parsed=JSON.parse(text);return importAll(parsed.data||parsed,true);}).then(function(){toast('Restored. Reloading...','success');setTimeout(function(){location.reload();},1000);});};$('reseedBtn').onclick=function(){if(!confirm('Clear all data and re-seed JTRWF?'))return;Promise.all(STORES.map(dbClear)).then(seedDatabase).then(function(){toast('Re-seeded','success');setTimeout(function(){location.reload();},800);});};$('validateImportBtn').onclick=function(){var file=$('importFile').files[0];previewStore=$('importStore').value;if(!file)return toast('Select a file','error');file.text().then(function(text){previewRows=parseCSV(text);var errors=validateCSV(previewStore,previewRows);var preview=$('importPreview');if(errors.length){preview.innerHTML='<div class="text-red"><strong>Errors:</strong><ul>'+errors.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul></div>';return;}preview.innerHTML='<p><strong>'+previewRows.length+'</strong> rows validated.</p><pre style="font-size:.7rem;overflow:auto;max-height:200px">'+esc(JSON.stringify(previewRows.slice(0,5),null,2))+'</pre><button class="btn btn-primary" id="commitImportBtn">Confirm & Commit</button>';$('commitImportBtn').onclick=function(){Promise.all(previewRows.map(function(r){if(!r.id)r.id=previewStore.slice(0,3).toUpperCase()+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);if(state.projectId&&!r.projectId)r.projectId=state.projectId;return save(previewStore,r,previewStore);})).then(function(){toast('Imported '+previewRows.length+' rows','success');return logAudit('IMPORT',previewStore,previewStore,{count:previewRows.length});});};});};$('saveSettingsBtn').onclick=function(){updateSettings({theme:$('themeSelect').value,companyName:$('companyName').value}).then(function(){document.documentElement.setAttribute('data-theme',$('themeSelect').value);localStorage.setItem('balsons_theme',$('themeSelect').value);toast('Settings saved','success');});};}};
function navigate(page){var mod=modules[page];if(!mod){$('contentArea').innerHTML='<div class="card text-red">Page not found</div>';return;}if(!hasPerm(mod.permission)&&!hasPerm('admin:read')){$('contentArea').innerHTML='<div class="card text-red">Access denied</div>';return;}state.currentPage=page;$('pageTitle').textContent=mod.title;document.querySelectorAll('#sidebarNav a').forEach(function(a){a.classList.toggle('active',a.dataset.page===page);});$('contentArea').innerHTML='<p class="text-muted">Loading...</p>';Promise.resolve(mod.render()).then(function(html){$('contentArea').innerHTML=html;if(mod.afterRender)return mod.afterRender();}).catch(function(err){$('contentArea').innerHTML='<div class="card text-red">'+esc(err.message)+'</div>';});}
function renderNav(){var nav=$('sidebarNav');nav.innerHTML=NAV.filter(function(item){return hasPerm(item.perm)||hasPerm('admin:read');}).map(function(item){return '<a data-page="'+item.id+'"><span class="ico">'+item.ico+'</span><span>'+item.label+'</span></a>';}).join('');nav.querySelectorAll('a').forEach(function(a){a.onclick=function(e){e.preventDefault();navigate(a.dataset.page);};});}
function showLogin(){$('loginScreen').style.display='flex';$('appScreen').classList.remove('active');}
function showApp(){$('loginScreen').style.display='none';$('appScreen').classList.add('active');$('userName').textContent=state.user?state.user.fullName||state.user.username:'';$('userRole').textContent=state.user?state.user.role:'';renderNav();navigate('dashboard');}
function globalSearch(q){q=q.trim().toLowerCase();if(!q)return Promise.resolve([]);var stores=['tasks','manpower','equipment','toolsInventory','risks','documents'];return Promise.all(stores.map(function(s){return list(s);})).then(function(results){var out=[];stores.forEach(function(s,i){results[i].forEach(function(item){var text=JSON.stringify(item).toLowerCase();if(text.indexOf(q)>=0)out.push({store:s,label:item.name||item.title||item.firstName||item.id,id:item.id});});});return out.slice(0,20);});}
function bindEvents(){$('loginForm').onsubmit=function(e){e.preventDefault();$('loginError').textContent='';verifyLogin($('loginUsername').value.trim(),$('loginPassword').value).then(function(s){if(!s){$('loginError').textContent='Invalid username or password.';return;}showApp();toast('Welcome, '+s.fullName,'success');});};$('logoutBtn').onclick=function(){logout();showLogin();$('loginUsername').value='';$('loginPassword').value='';};$('refreshBtn').onclick=function(){navigate(state.currentPage);toast('Refreshed');};$('themeToggle').onclick=function(){var next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('balsons_theme',next);};$('modalClose').onclick=closeModal;$('modalCancelBtn').onclick=closeModal;$('modalOverlay').onclick=function(e){if(e.target.id==='modalOverlay')closeModal();};var st; $('globalSearch').oninput=function(e){clearTimeout(st);st=setTimeout(function(){globalSearch(e.target.value).then(function(results){var box=$('searchResults');if(!e.target.value.trim()){box.innerHTML='';box.classList.add('hidden');return;}box.classList.remove('hidden');box.innerHTML=results.length?results.map(function(r){return '<div data-page="'+({tasks:'wbs',toolsInventory:'tools'}[r.store]||r.store)+'"><strong>'+esc(r.label)+'</strong> <span class="text-muted">'+r.store+'</span></div>';}).join(''):'<div class="text-muted" style="padding:.5rem">No results</div>';box.querySelectorAll('div[data-page]').forEach(function(d){d.onclick=function(){navigate(d.dataset.page);box.classList.add('hidden');};});});},300);};}
function init(){return seedDatabase().then(getSettings).then(function(settings){var theme=localStorage.getItem('balsons_theme')||settings.theme||'light';document.documentElement.setAttribute('data-theme',theme);if(loadSession())showApp();else showLogin();bindEvents();}).catch(function(err){console.error(err);toast('Init failed: '+err.message,'error');});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
