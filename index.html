<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balsons Jupiter Suite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       BALSONS BRAND – TEAL (#0097B2) & RED (#E64646)
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --teal: #0097B2;
      --teal-dark: #007A8F;
      --red: #E64646;
      --red-dark: #C93A3A;
      --white: #F9F7F4;
      --gray: #E5E2DC;
      --shadow: 0 6px 24px rgba(0,0,0,0.12);
      --radius: 12px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #F0EDE8;
      color: #1A1A1A;
      height: 100vh;
      overflow: hidden;
    }
    /* ----- LOGIN SCREEN ----- */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0B1A33;
    }
    .login-box {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    .login-box .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-box .brand i {
      font-size: 3rem;
      color: var(--teal);
    }
    .login-box .brand h1 {
      font-size: 1.8rem;
      color: #0B1A33;
    }
    .login-box .brand h1 span { color: var(--red); }
    .login-box .brand p {
      color: #888;
      font-size: 0.9rem;
    }
    .login-box .form-group { margin-bottom: 1rem; }
    .login-box .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.2rem;
    }
    .login-box .form-group input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1.5px solid #D5D0C8;
      border-radius: 6px;
      font-family: inherit;
    }
    .login-box .form-group input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,151,178,0.2);
    }
    .login-box .btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--teal);
      color: white;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-box .btn:hover { background: var(--teal-dark); }
    .login-box .error {
      color: var(--red);
      margin-top: 1rem;
      text-align: center;
    }

    /* ----- MAIN APP LAYOUT ----- */
    #appScreen {
      display: none;
      height: 100vh;
      flex-direction: row;
    }
    .sidebar {
      width: 240px;
      background: #0B1A33;
      color: white;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .sidebar .brand {
      padding: 1.2rem 1.2rem;
      border-bottom: 3px solid var(--teal);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .sidebar .brand i {
      font-size: 1.8rem;
      color: var(--teal);
    }
    .sidebar .brand h1 {
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1.2;
    }
    .sidebar .brand h1 span { color: var(--red); }
    .sidebar .brand small {
      display: block;
      font-size: 0.6rem;
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
    }
    .sidebar nav {
      flex: 1;
      padding: 1rem 0.5rem;
      overflow-y: auto;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s;
      margin-bottom: 0.2rem;
      cursor: pointer;
    }
    .sidebar nav a i { width: 1.2rem; text-align: center; }
    .sidebar nav a:hover { background: rgba(255,255,255,0.08); color: white; }
    .sidebar nav a.active {
      background: var(--teal);
      color: white;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(0,151,178,0.3);
    }
    .sidebar .footer {
      padding: 1rem;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .sidebar .user-info {
      padding: 0.8rem 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.8rem;
      color: rgba(255,255,255,0.7);
    }
    .sidebar .user-info strong { color: white; }
    .sidebar .logout-btn {
      background: var(--red);
      color: white;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.3rem;
      font-size: 0.75rem;
      transition: 0.2s;
    }
    .sidebar .logout-btn:hover { background: var(--red-dark); }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .main .topbar {
      background: white;
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gray);
      flex-shrink: 0;
    }
    .main .topbar .page-title {
      font-weight: 700;
      font-size: 1.2rem;
      color: #0B1A33;
    }
    .main .topbar .actions { display: flex; gap: 0.8rem; }
    .main .topbar .actions button {
      background: var(--teal);
      color: white;
      border: none;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      cursor: pointer;
    }
    .main .topbar .actions button:hover { background: var(--red); }
    .main .content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem 2rem;
    }

    /* ----- DASHBOARD CARDS ----- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: white;
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--teal);
    }
    .stat-card .label { font-size: 0.7rem; text-transform: uppercase; color: #888; font-weight: 600; }
    .stat-card .value { font-size: 1.8rem; font-weight: 800; color: #0B1A33; }
    .stat-card .sub { font-size: 0.75rem; color: #999; }

    .dash-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }
    .dash-card {
      background: white;
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      box-shadow: var(--shadow);
    }
    .dash-card h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #0B1A33;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dash-card h3 i { color: var(--teal); }

    /* ----- TABLES ----- */
    .table-wrap { overflow-x: auto; margin-top: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px; }
    table th { background: #0B1A33; color: white; padding: 0.5rem 0.7rem; text-align: left; font-weight: 600; white-space: nowrap; }
    table td { padding: 0.4rem 0.7rem; border-bottom: 1px solid #EDEAE4; }
    table tr:hover td { background: #F8F6F2; }

    .badge {
      display: inline-block;
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge.Planned { background: #E0E0E0; color: #555; }
    .badge.Ready { background: #D1ECF1; color: #0C5460; }
    .badge.In-Progress { background: #FFF3CD; color: #856404; }
    .badge.Blocked { background: #F8D7DA; color: #721C24; }
    .badge.Completed { background: #D4EDDA; color: #155724; }
    .badge.Verified { background: #C5D8E8; color: #1E3A6F; }
    .badge.Approved { background: #D4EDDA; color: #155724; }
    .badge.Rejected { background: #F8D7DA; color: #721C24; }
    .badge.Pending { background: #FFF3CD; color: #856404; }
    .badge.Generated { background: #C5D8E8; color: #1E3A6F; }
    .badge.Issue { background: #F8D7DA; color: #721C24; }
    .badge.Return { background: #D4EDDA; color: #155724; }

    .progress-bar {
      width: 60px;
      height: 6px;
      background: #EDEAE4;
      border-radius: 10px;
      display: inline-block;
      overflow: hidden;
      vertical-align: middle;
    }
    .progress-bar .fill {
      height: 100%;
      background: var(--teal);
      border-radius: 10px;
      transition: width 0.3s;
    }

    .action-btn {
      background: transparent;
      border: none;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
    }
    .action-btn.edit { color: #0B1A33; }
    .action-btn.edit:hover { background: #E0E0E0; }
    .action-btn.delete { color: var(--red); }
    .action-btn.delete:hover { background: #F8D7DA; }

    /* ----- MODALS ----- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11,26,51,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: white;
      border-radius: var(--radius);
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.8rem 2rem;
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn { 0% { opacity:0; transform: scale(0.95) translateY(10px); } 100% { opacity:1; transform: scale(1) translateY(0); } }
    .modal-box .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .modal-box .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0B1A33;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .modal-box .modal-header h2 i { color: var(--teal); }
    .modal-close {
      font-size: 1.5rem;
      cursor: pointer;
      color: #AAA;
      padding: 0 0.5rem;
    }
    .modal-close:hover { color: var(--red); }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 0.2rem;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.5rem 0.8rem;
      border: 1.5px solid #D5D0C8;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,151,178,0.2);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .modal-footer {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }
    .btn {
      padding: 0.5rem 1.4rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-primary { background: var(--teal); color: white; }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover { background: var(--red-dark); }
    .btn-secondary { background: #E5E2DC; color: #333; }
    .btn-secondary:hover { background: #D5D0C8; }
    .btn-success { background: #2D8F5C; color: white; }
    .btn-success:hover { background: #1E7B4A; }

    /* ----- TOASTS ----- */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {
      background: #0B1A33;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      font-weight: 500;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: slideUp 0.3s ease;
      border-left: 4px solid var(--teal);
    }
    .toast.success { border-left-color: #2D8F5C; }
    .toast.error { border-left-color: var(--red); }
    @keyframes slideUp { 0% { opacity:0; transform: translateY(20px); } 100% { opacity:1; transform: translateY(0); } }

    /* ----- SUB-NAV TABS ----- */
    .subnav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--gray);
      padding-bottom: 0.5rem;
    }
    .subnav button {
      background: transparent;
      border: none;
      padding: 0.4rem 1rem;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      border-radius: 20px;
      transition: 0.2s;
    }
    .subnav button:hover { background: #f0f0f0; }
    .subnav button.active {
      background: var(--teal);
      color: white;
    }
    .panel { display: none; }
    .panel.active { display: block; }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 768px) {
      .sidebar { width: 60px; }
      .sidebar .brand h1, .sidebar .brand small, .sidebar nav a span, .sidebar .footer, .sidebar .user-info { display: none; }
      .sidebar nav a { justify-content: center; padding: 0.6rem; }
      .sidebar .brand { justify-content: center; }
      .main .content { padding: 1rem; }
      .dash-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
    .text-center { text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ============================================================
       LOGIN SCREEN
  ============================================================ -->
  <div id="loginScreen">
    <div class="login-box">
      <div class="brand">
        <i class="fas fa-cog"></i>
        <h1>BALSONS <span>·</span> JUPITER</h1>
        <p>Project Management Suite</p>
      </div>
      <form id="loginForm" onsubmit="login(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="Enter username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Login</button>
        <div id="loginError" class="error"></div>
      </form>
    </div>
  </div>

  <!-- ============================================================
       MAIN APP
  ============================================================ -->
  <div id="appScreen">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <i class="fas fa-cog"></i>
        <div>
          <h1>BALSONS <span>·</span> JUPITER</h1>
          <small>PROJECT SUITE</small>
        </div>
      </div>
      <nav>
        <a class="active" data-page="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
        <a data-page="project"><i class="fas fa-tasks"></i><span>Project Manager</span></a>
        <a data-page="tools"><i class="fas fa-toolbox"></i><span>Tools / Store</span></a>
        <a data-page="hrms"><i class="fas fa-user-cog"></i><span>HRMS · ERP · Payroll</span></a>
      </nav>
      <div class="user-info">
        <div><strong id="userName">User</strong></div>
        <div style="font-size:0.7rem; color:rgba(255,255,255,0.5);" id="userRole">role</div>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
      <div class="footer">v5.0 · Balsons Heavy Lift</div>
    </aside>

    <!-- Main content -->
    <div class="main">
      <div class="topbar">
        <div class="page-title" id="pageTitle">Dashboard</div>
        <div class="actions">
          <button id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
      </div>
      <div class="content" id="contentArea">
        <div class="text-center" style="padding: 3rem;"><i class="fas fa-spinner fa-spin fa-2x"></i> Loading...</div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       MODAL
  ============================================================ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle"><i class="fas fa-pen"></i> Edit</h2>
        <span class="modal-close" onclick="closeModal()">&times;</span>
      </div>
      <form id="modalForm" onsubmit="handleModalSubmit(event)">
        <div id="modalFields"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modalSubmitBtn"><i class="fas fa-save"></i> Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================================
       TOAST CONTAINER
  ============================================================ -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ============================================================
       JAVASCRIPT
  ============================================================ -->
  <script>
    // ================================================================
    //  CONFIGURATION – REPLACE WITH YOUR GAS DEPLOYMENT URLs
    // ================================================================
      const API_BASE_PROJECT = 'https://script.google.com/macros/s/AKfycbyj1KOerxA0xQsX9DddhpAR8X6CSxt_TC9TYBszHT1dYcvYdNoqNRJ9HW9oFQst5TX_Nw/exec';
    const API_BASE_TOOLS = 'https://script.google.com/macros/s/AKfycbzioH4shdIafsOZ77YmqUOocmYQ5Xq64uEfkE0XeMbLvTN-N-5U-GXFJUEEYYaulbS7-Q/exec';
    const API_BASE_HRMS = 'https://script.google.com/macros/s/AKfycbzJezsW9WTozgTVMkmrlY9lQ_xRBdEtBewxSAwoaHEuu5AskFm6bomycvAR0nc7h76u/exec';
    // ================================================================
    //  AUTHENTICATION
    // ================================================================
    let authToken = null;
    let currentUser = null;

    async function login(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');
      errorDiv.textContent = '';
      try {
        const response = await fetch(API_BASE_HRMS, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username, password }),
          headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();
        if (result.success) {
          authToken = result.data.token;
          currentUser = result.data.user;
          localStorage.setItem('balsons_token', authToken);
          localStorage.setItem('balsons_user', JSON.stringify(currentUser));
          showApp();
        } else {
          errorDiv.textContent = result.error || 'Login failed';
        }
      } catch (err) {
        errorDiv.textContent = 'Network error. Please try again.';
      }
    }

    function logout() {
      localStorage.removeItem('balsons_token');
      localStorage.removeItem('balsons_user');
      authToken = null;
      currentUser = null;
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('loginUsername').value = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginError').textContent = '';
    }

    function checkSession() {
      const token = localStorage.getItem('balsons_token');
      const user = localStorage.getItem('balsons_user');
      if (token && user) {
        authToken = token;
        currentUser = JSON.parse(user);
        // Optionally validate token with HRMS
        showApp();
      } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appScreen').style.display = 'none';
      }
    }

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'flex';
      // Update user info
      document.getElementById('userName').textContent = currentUser.fullName || currentUser.username;
      document.getElementById('userRole').textContent = currentUser.role;
      // Load dashboard by default
      loadPage('dashboard');
    }

    // ================================================================
    //  API CALL HELPER
    // ================================================================
    async function apiCall(baseUrl, action, payload) {
      const response = await fetch(baseUrl, {
        method: 'POST',
        body: JSON.stringify({ token: authToken, action, payload: payload || {} }),
        headers: { 'Content-Type': 'application/json' }
      });
      const result = await response.json();
      if (!result.success) {
        if (result.error && result.error.includes('Invalid or expired token')) {
          logout();
          throw new Error('Session expired. Please log in again.');
        }
        throw new Error(result.error || 'Unknown error');
      }
      return result.data;
    }

    // Module-specific wrappers
    function projectApi(action, payload) { return apiCall(API_BASE_PROJECT, action, payload); }
    function toolsApi(action, payload) { return apiCall(API_BASE_TOOLS, action, payload); }
    function hrmsApi(action, payload) { return apiCall(API_BASE_HRMS, action, payload); }

    // ================================================================
    //  NAVIGATION
    // ================================================================
    let currentPage = 'dashboard';

    document.querySelectorAll('.sidebar nav a').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
        this.classList.add('active');
        const page = this.dataset.page;
        currentPage = page;
        document.getElementById('pageTitle').textContent = this.textContent.trim();
        loadPage(page);
      });
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadPage(currentPage);
      toast('Refreshed');
    });

    function loadPage(page) {
      const area = document.getElementById('contentArea');
      area.innerHTML = '<div class="text-center" style="padding: 2rem;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
      switch(page) {
        case 'dashboard': loadDashboard(); break;
        case 'project': loadProject(); break;
        case 'tools': loadTools(); break;
        case 'hrms': loadHRMS(); break;
        default: area.innerHTML = '<p>Page not found.</p>';
      }
    }

    // ================================================================
    //  DASHBOARD
    // ================================================================
    async function loadDashboard() {
      try {
        // For dashboard, we need aggregated data from all modules.
        // We'll fetch tasks from Project and employees from HRMS.
        const [tasks, employees, inventory] = await Promise.all([
          projectApi('getTasks'),
          hrmsApi('getEmployees'),
          toolsApi('getInventory')
        ]);
        const totalTasks = tasks.length;
        const completed = tasks.filter(t => t.status === 'Completed' || t.status === 'Verified').length;
        const blocked = tasks.filter(t => t.status === 'Blocked').length;
        const totalEmployees = employees.length;
        const totalTools = inventory.length;

        const area = document.getElementById('contentArea');
        area.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card"><div class="label">Total Tasks</div><div class="value">${totalTasks}</div><div class="sub">${completed} completed</div></div>
            <div class="stat-card"><div class="label">Blocked Tasks</div><div class="value" style="color:var(--red);">${blocked}</div><div class="sub">Needs attention</div></div>
            <div class="stat-card"><div class="label">Employees</div><div class="value">${totalEmployees}</div><div class="sub">Active workforce</div></div>
            <div class="stat-card"><div class="label">Tools Inventory</div><div class="value">${totalTools}</div><div class="sub">Items in stock</div></div>
          </div>
          <div class="dash-grid">
            <div class="dash-card">
              <h3><i class="fas fa-tasks"></i> Recent Tasks</h3>
              ${tasks.slice(0,5).map(t => `
                <div style="display:flex; justify-content:space-between; padding:0.3rem 0; border-bottom:1px solid #f0f0f0;">
                  <span>${t.name}</span>
                  <span class="badge ${t.status.replace(' ', '-')}">${t.status}</span>
                </div>
              `).join('')}
              ${tasks.length === 0 ? '<p>No tasks yet.</p>' : ''}
            </div>
            <div class="dash-card">
              <h3><i class="fas fa-users"></i> Quick Actions</h3>
              <button class="btn btn-primary" style="width:100%; margin-bottom:0.5rem;" onclick="navigateTo('project')"><i class="fas fa-plus"></i> Add Task</button>
              <button class="btn btn-primary" style="width:100%; margin-bottom:0.5rem; background:var(--teal-dark);" onclick="navigateTo('tools')"><i class="fas fa-exchange-alt"></i> Issue Tool</button>
              <button class="btn btn-primary" style="width:100%; background:#2D8F5C;" onclick="navigateTo('hrms')"><i class="fas fa-user-plus"></i> Add Employee</button>
            </div>
          </div>
        `;
      } catch (err) {
        showError('Dashboard', err.message);
      }
    }

    async function switchProjectTab(tab) {

      document.querySelectorAll('.subnav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

      panel.classList.add('active');
      try {
        if (tab === 'tasks') await loadTasksUI();
        else if (tab === 'schedule') await loadReadonly('schedule', 'getSchedule');
        else if (tab === 'resources') await loadReadonly('resources', 'getResources');
        else if (tab === 'risks') await loadReadonly('risks', 'getRisks');
        else if (tab === 'commercial') await loadReadonly('commercial', 'getCommercial');

        panel.innerHTML = `<p style="color:var(--red);">Error: ${err.message}</p>`;

    async function loadReadonly(panelId, action) {
      const panel = document.getElementById('panel-' + panelId);
      const data = await projectApi(action);
      if (!data || data.length === 0) {
        panel.innerHTML = '<p>No data available.</p>';
        return;
      }
      const headers = data[0];
      let html = `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
      for (let i=1; i<data.length; i++) {
        const row = data[i];
        if (row.every(cell => cell.toString().trim() === '')) continue;
        html += `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`;
      }
      html += `</tbody></table></div>`;
      panel.innerHTML = html;
    }

      document.getElementById('modalSubmitBtn').innerHTML = `<i class="fas fa-save"></i> ${isEdit ? 'Update' : 'Save'}`;
      document.getElementById('modalOverlay').classList.add('open');
    }

    async function deleteEmployee(id) {
      if (!confirm('Delete employee ' + id + '?')) return;
      try {
        await hrmsApi('deleteEmployee', { id });
        toast('Employee deleted', 'success');
        loadEmployees();
      } catch (err) {
        toast('Error: ' + err.message, 'error');
      }
    }

    // ---- Attendance ----
    async function loadAttendanceUI() {
      const container = document.getElementById('panel-attendance');
      // Ensure employeesData is loaded
      if (employeesData.length === 0) await loadEmployees();
      container.innerHTML = `
        <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1rem;">
          <div><label>Date</label><input type="date" id="attDate" value="${new Date().toISOString().split('T')[0]}"></div>
          <div><label>Employee</label><select id="attEmpId">${employeesData.map(e => `<option value="${e.id}">${e.firstName} ${e.lastName}</option>`).join('')}</select></div>
          <div><label>Clock In</label><input type="time" id="attIn" value="08:00"></div>
          <div><label>Clock Out</label><input type="time" id="attOut" value="17:00"></div>
          <div><label>Overtime</label><input type="number" id="attOT" value="0" step="0.5"></div>
          <div><label>Leave Type</label>
            <select id="attLeave"><option value="">None</option><option value="Full Day">Full Day</option><option value="Half Day">Half Day</option></select>
          </div>
          <div><label>Remarks</label><input type="text" id="attRemarks"></div>
          <div style="align-self:flex-end;"><button class="btn btn-primary" onclick="addAttendance()"><i class="fas fa-plus"></i> Add</button></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Employee</th><th>In</th><th>Out</th><th>Hours</th><th>OT</th><th>Leave</th><th>Remarks</th></tr></thead>
            <tbody id="attBody"><tr><td colspan="8">Loading...</td></tr></tbody>
          </table>
        </div>
      `;
      await loadAttendance();
    }

    async function loadAttendance() {
      const month = new Date().toISOString().slice(0,7);
      const data = await hrmsApi('getAttendance', { month });
      const tbody = document.getElementById('attBody');
      if (!tbody) return;
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8">No records.</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(a => `
        <tr>
          <td>${a.date}</td>
          <td>${a.empId}</td>
          <td>${a.clockIn}</td>
          <td>${a.clockOut}</td>
          <td>${a.hours}</td>
          <td>${a.overtime}</td>
          <td>${a.leaveType || '-'}</td>
          <td>${a.remarks || '-'}</td>
        </tr>
      `).join('');
    }

    async function addAttendance() {
      const date = document.getElementById('attDate').value;
      const empId = document.getElementById('attEmpId').value;
      const clockIn = document.getElementById('attIn').value;
      const clockOut = document.getElementById('attOut').value;
      const overtime = parseFloat(document.getElementById('attOT').value) || 0;
      const leaveType = document.getElementById('attLeave').value;
      const remarks = document.getElementById('attRemarks').value.trim();
      if (!date || !empId) return toast('Date and Employee required', 'error');
      let hours = 0;
      if (clockIn && clockOut) {
        const [inH, inM] = clockIn.split(':').map(Number);
        const [outH, outM] = clockOut.split(':').map(Number);
        hours = (outH - inH) + (outM - inM) / 60;
        if (hours < 0) hours += 24;
      }
      try {
        await hrmsApi('addAttendance', { date, empId, clockIn, clockOut, hours, overtime, leaveType, remarks });
        toast('Attendance added', 'success');
        loadAttendance();
      } catch (err) {
        toast('Error: ' + err.message, 'error');
      }
    }

    // ---- Leave ----
    async function loadLeaveUI() {
      const container = document.getElementById('panel-leave');
      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
          <button class="btn btn-primary" onclick="openLeaveModal()"><i class="fas fa-plus"></i> Request Leave</button>
          <select id="leaveFilter" onchange="loadLeaveRequests()"><option value="all">All</option><option value="Pending">Pending</option><option value="Approved">Approved</option><option value="Rejected">Rejected</option></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Employee</th><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Reason</th><th>Status</th><th>Approved By</th><th>Actions</th></tr></thead>
            <tbody id="leaveBody"><tr><td colspan="10">Loading...</td></tr></tbody>
          </table>
        </div>
      `;
      await loadLeaveRequests();
    }

    async function loadLeaveRequests() {
      const status = document.getElementById('leaveFilter')?.value || 'all';
      const data = await hrmsApi('getLeaveRequests', { status: status === 'all' ? null : status });
      const tbody = document.getElementById('leaveBody');
      if (!tbody) return;
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10">No requests.</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(l => `
        <tr>
          <td>${l.id}</td>
          <td>${l.empId}</td>
          <td>${l.type}</td>
          <td>${l.start}</td>
          <td>${l.end}</td>
          <td>${l.days}</td>
          <td>${l.reason}</td>
          <td><span class="badge ${l.status}">${l.status}</span></td>
          <td>${l.approvedBy || '-'}</td>
          <td>
            ${l.status === 'Pending' ? `
              <button class="action-btn edit" onclick="approveLeave('${l.id}','Approved')"><i class="fas fa-check"></i></button>
              <button class="action-btn delete" onclick="approveLeave('${l.id}','Rejected')"><i class="fas fa-times"></i></button>
            ` : '-'}
          </td>
        </tr>
      `).join('');
    }

    function openLeaveModal() {
      document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus"></i> Request Leave';
      document.getElementById('modalFields').innerHTML = `
        <div class="form-group"><label>Employee</label><select id="leaveEmpId">${employeesData.map(e => `<option value="${e.id}">${e.firstName} ${e.lastName}</option>`).join('')}</select></div>
        <div class="form-group"><label>Leave Type</label>
          <select id="leaveType"><option value="Casual">Casual</option><option value="Sick">Sick</option><option value="Earned">Earned</option><option value="Other">Other</option></select>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Start Date</label><input type="date" id="leaveStart"></div>
          <div class="form-group"><label>End Date</label><input type="date" id="leaveEnd"></div>
        </div>
        <div class="form-group"><label>Reason</label><textarea id="leaveReason"></textarea></div>
      `;
      document.getElementById('modalSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Submit';
      document.getElementById('modalOverlay').classList.add('open');
    }

    async function approveLeave(id, status) {
      try {
        await hrmsApi('updateLeaveStatus', { leaveId: id, status, approver: currentUser.fullName || 'Manager' });
        toast(`Leave ${status}`, 'success');
        loadLeaveRequests();
      } catch (err) {
        toast('Error: ' + err.message, 'error');
      }
    }

    // ---- Payroll ----
    async function loadPayrollUI() {
      const container = document.getElementById('panel-payroll');
      const now = new Date();
      const month = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
      container.innerHTML = `
        <div style="display:flex; gap:1rem; align-items:center; margin-bottom:1rem;">
          <label>Month: <input type="month" id="payrollMonth" value="${month}"></label>
          <button class="btn btn-success" onclick="runPayroll()"><i class="fas fa-calculator"></i> Generate</button>
          <button class="btn btn-primary" onclick="viewPayroll()"><i class="fas fa-eye"></i> View</button>
        </div>
        <div id="payrollResult"></div>
      `;
    }

    async function runPayroll() {
      const month = document.getElementById('payrollMonth').value;
      if (!month) return toast('Select a month', 'error');
      try {
        await hrmsApi('generatePayroll', { month });
        toast('Payroll generated', 'success');
        viewPayroll();
      } catch (err) {
        toast('Error: ' + err.message, 'error');
      }
    }

    async function viewPayroll() {
      const month = document.getElementById('payrollMonth').value;
      if (!month) return;
      try {
        const data = await hrmsApi('getPayroll', { month });
        const container = document.getElementById('payrollResult');
        if (!data || data.length === 0) {
          container.innerHTML = '<p>No payroll records.</p>';
          return;
        }
        let html = `<div class="table-wrap"><table>
          <thead><tr><th>Emp ID</th><th>Name</th><th>Squad</th><th>Basic</th><th>HRA</th><th>Allow.</th><th>OT Pay</th><th>Gross</th><th>PF</th><th>ESI</th><th>TDS</th><th>Ded.</th><th>Net Pay</th><th>Status</th></tr></thead><tbody>
          ${data.map(p => `
            <tr>
              <td>${p.empId}</td>
              <td>${p.name}</td>
              <td>${p.squad}</td>
              <td>₹${p.basic.toFixed(2)}</td>
              <td>₹${p.hra.toFixed(2)}</td>
              <td>₹${p.allowances.toFixed(2)}</td>
              <td>₹${p.overtimePay.toFixed(2)}</td>
              <td>₹${p.gross.toFixed(2)}</td>
              <td>₹${p.pf.toFixed(2)}</td>
              <td>₹${p.esi.toFixed(2)}</td>
              <td>₹${p.tds.toFixed(2)}</td>
              <td>₹${p.totalDed.toFixed(2)}</td>
              <td><strong>₹${p.net.toFixed(2)}</strong></td>
              <td><span class="badge ${p.status}">${p.status}</span></td>
            </tr>
          `).join('')}
          </tbody></table></div>`;
        container.innerHTML = html;
      } catch (err) {
        toast('Error: ' + err.message, 'error');

    // ---- Recruitment, Performance, Training ----
    // (We'll implement them with similar patterns; for brevity, we provide minimal versions.)

          <select id="recFilter" onchange="loadRecruitment()"><option value="all">All</option><option value="Applied">Applied</option><option value="Interview">Interview</option><option value="Offer">Offer</option><option value="Hired">Hired</option></select>

    async function loadRecruitment() {

          <td><span class="badge ${r.status}">${r.status}</span></td>
          <td>${r.interviewDate}</td>
          <td>${r.notes}</td>
          <td>
            <button class="action-btn edit" onclick="openRecruitmentModal('${r.id}')"><i class="fas fa-edit"></i></button>

    // Similar functions for Performance and Training – we'll skip for brevity.

    // ================================================================
    //  MODAL SUBMIT HANDLER (universal)
    // ================================================================
    async function handleModalSubmit(e) {
      e.preventDefault();
      // Detect which form is open
      if (document.getElementById('empId')) {
        // Employee
        const id = document.getElementById('empId').value;
        const emp = {
          id: id,
          firstName: document.getElementById('empFirstName').value.trim(),
          lastName: document.getElementById('empLastName').value.trim(),
          email: document.getElementById('empEmail').value.trim(),
          phone: document.getElementById('empPhone').value.trim(),
          dob: document.getElementById('empDob').value,
          gender: document.getElementById('empGender').value,
          address: document.getElementById('empAddress').value.trim(),
          emergency: document.getElementById('empEmergency').value.trim(),
          dependents: document.getElementById('empDependents').value.trim(),
          qualifications: document.getElementById('empQualifications').value.trim(),
          experience: document.getElementById('empExperience').value.trim(),
          documents: document.getElementById('empDocuments').value.trim(),
          squad: document.getElementById('empSquad').value,
          role: document.getElementById('empRole').value.trim(),
          joiningDate: document.getElementById('empJoining').value,
          salary: parseFloat(document.getElementById('empSalary').value) || 0,
          bank: document.getElementById('empBank').value.trim()
        };
        if (!emp.firstName) return toast('First Name required', 'error');
        try {
          if (id) await hrmsApi('updateEmployee', emp);
          else await hrmsApi('addEmployee', emp);
          toast(id ? 'Updated' : 'Added', 'success');
          closeModal();
          loadEmployees();
        } catch (err) {
          toast('Error: ' + err.message, 'error');
        }
        return;
      }

      if (document.getElementById('taskId')) {
        // Task
        const id = document.getElementById('taskId').value;
        const task = {
          id: id,
          name: document.getElementById('taskName').value.trim(),
          epic: document.getElementById('taskEpic').value,
          assignedTo: document.getElementById('taskAssigned').value.trim(),
          status: document.getElementById('taskStatus').value,
          start: document.getElementById('taskStart').value,
          end: document.getElementById('taskEnd').value,
          progress: parseInt(document.getElementById('taskProgress').value) || 0,
          dependency: document.getElementById('taskDependency').value.trim()
        };
        if (!task.name) return toast('Task name required', 'error');
        try {
          if (id) await projectApi('updateTask', task);
          else await projectApi('addTask', task);
          toast(id ? 'Task updated' : 'Task added', 'success');
          closeModal();
          loadTasksUI();
        } catch (err) {
          toast('Error: ' + err.message, 'error');
        }
        return;
      }

      if (document.getElementById('trItemId')) {
        // Transaction
        const trans = {
          date: document.getElementById('trDate').value,
          itemId: document.getElementById('trItemId').value.trim(),
          itemName: document.getElementById('trItemName').value.trim(),
          type: document.getElementById('trType').value,
          qty: parseFloat(document.getElementById('trQty').value) || 0,
          issuedTo: document.getElementById('trIssuedTo').value.trim(),
          returnedBy: document.getElementById('trReturnedBy').value.trim(),
          remarks: document.getElementById('trRemarks').value.trim()
        };
        if (!trans.itemId || !trans.itemName) return toast('Item ID and Name required', 'error');
        try {
          await toolsApi('addTransaction', trans);
          toast('Transaction added', 'success');
          closeModal();
          loadTransactionsUI();
        } catch (err) {
          toast('Error: ' + err.message, 'error');
        }
        return;
      }

      if (document.getElementById('leaveStart')) {
        // Leave request
        const empId = document.getElementById('leaveEmpId').value;
        const type = document.getElementById('leaveType').value;
        const start = document.getElementById('leaveStart').value;
        const end = document.getElementById('leaveEnd').value;
        const reason = document.getElementById('leaveReason').value.trim();
        if (!empId || !start || !end) return toast('Employee and dates required', 'error');
        const days = Math.ceil((new Date(end) - new Date(start)) / (1000*60*60*24)) + 1;
        try {
          await hrmsApi('addLeaveRequest', { empId, type, start, end, days, reason });
          toast('Leave request submitted', 'success');
          closeModal();
          loadLeaveRequests();
        } catch (err) {
          toast('Error: ' + err.message, 'error');
        }
        return;
      }

      toast('Unknown form', 'error');
    }

    // ================================================================
    //  UTILITY
    // ================================================================
    function showError(title, error) {
      document.getElementById('contentArea').innerHTML = `<div class="dash-card" style="color:var(--red);"><h3><i class="fas fa-exclamation-circle"></i> Error loading ${title}</h3><p>${error}</p></div>`;
    }

    function toast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
      toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(30px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    // ================================================================
    //  INIT – check session
    // ================================================================
    window.onload = function() {
      checkSession();
    };
  </script>
